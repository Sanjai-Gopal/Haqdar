<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haqdar – Know what you are owed</title>
<meta name="description" content="Find the government schemes you qualify for, the documents you need and where to apply. English, Tamil, Hindi. Works offline. Nothing leaves your device.">
<style>
:root{--ink:#14213d;--muted:#5b6478;--bg:#fffaf0;--card:#fff;--line:#eadfc8;--saffron:#f59e0b;--saffron-d:#b45309;--green:#0f766e;--green-bg:#e6f4f1;--amber-bg:#fff4d6;--r:16px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Tamil","Noto Sans Devanagari",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;padding:14px clamp(16px,4vw,40px);position:sticky;top:0;background:rgba(255,250,240,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);z-index:5}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}.logo span{color:var(--saffron)}
.lang button{border:1px solid var(--line);background:#fff;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.lang button:first-child{border-radius:10px 0 0 10px}.lang button:last-child{border-radius:0 10px 10px 0}
.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hero{padding:34px clamp(16px,4vw,40px) 10px;max-width:1200px;margin:auto}
.hero h1{font-size:clamp(26px,4.5vw,44px);line-height:1.15;margin:0 0 10px;letter-spacing:-1px}
.hero p{color:var(--muted);max-width:720px;margin:0 0 10px;font-size:17px}
.priv{display:inline-block;background:var(--green-bg);color:var(--green);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600}
.demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.demo b{font-size:14px;color:var(--muted)}
.demo button{border:1.5px dashed var(--saffron);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;color:var(--ink)}
.demo button:hover{background:var(--amber-bg)}
main{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:24px;max-width:1200px;margin:20px auto 40px;padding:0 clamp(16px,4vw,40px);align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
#form{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:sticky;top:76px}
@media(max-width:860px){#form{position:static}}
h2{margin:0 0 14px;font-size:20px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
input[type=number],select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;cursor:pointer;color:var(--ink);min-height:44px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:24px;letter-spacing:-.5px}.stat span{font-size:12px;color:var(--muted)}
.stat.hl{background:var(--ink);color:#fff;border-color:var(--ink)}.stat.hl span{color:#cbd5e1}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--green);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.card.maybe{border-left-color:var(--saffron)}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{margin:0;font-size:18px}
.badge{white-space:nowrap;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--green-bg);color:var(--green)}
.maybe .badge{background:var(--amber-bg);color:var(--saffron-d)}
.ben{margin:6px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:#f3efe4;border-radius:999px;padding:3px 10px;color:#4a4331}
.actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--saffron-d);margin-top:10px}
details ul{margin:8px 0 6px;padding-left:20px;font-size:14px}
details a{color:var(--green);font-weight:600}
.btn{border:1.5px solid var(--ink);background:#fff;border-radius:12px;padding:9px 14px;font-size:14px;cursor:pointer;color:var(--ink);font-weight:600}
.btn.pri{background:var(--ink);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;margin-top:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:18px 0}
.bar{height:8px;background:#efe8d6;border-radius:99px;overflow:hidden;margin:8px 0 12px}.bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.doc{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f1ead8}
.doc input{width:20px;height:20px;accent-color:var(--green)}
.doc small{margin-left:auto;color:var(--muted);white-space:nowrap}
ol.road{padding-left:20px;margin:0}ol.road li{margin-bottom:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
footer{max-width:1200px;margin:0 auto 40px;padding:0 clamp(16px,4vw,40px);color:var(--muted);font-size:13px}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media print{header,#form,.demo,.tools,.actions,.hero p,.priv,details summary{display:none!important}main{display:block}details{display:block}details>*{display:block}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>

function evaluate(P){
  const i=INC[P.income],out=[];
  for(const s of SCHEMES){const r=s.test(P,i);if(r)out.push({s,level:r.level,why:r.why});}
  out.sort((a,b)=>(a.level===b.level?0:a.level==='match'?-1:1)||b.s.w-a.s.w);
  return out;
}
function totals(res){
  let cash=0,cover=0;const seen=new Set();
  for(const r of res){if(r.level!=='match')continue;cash+=r.s.cash;if(r.s.cover&&!seen.has(r.s.id)){cover+=r.s.cover;seen.add(r.s.id);}}
  return{cash,cover,likely:res.filter(r=>r.level==='match').length,check:res.filter(r=>r.level==='maybe').length};
}
function docUsage(res){
  const m={};for(const r of res)for(const d of r.s.docs)m[d]=(m[d]||0)+1;
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

function renderForm(){
  let h=`<h2>${t('aboutYou')}</h2>`;
  for(const F of FIELDS){
    h+=`<div class="field"><label>${t('f_'+F.k)}</label>`;
    if(F.type==='num')h+=`<input type="number" inputmode="numeric" min="1" max="110" data-num="${F.k}" value="${P[F.k]}">`;
    else if(F.type==='sel'){h+=`<select data-sel="${F.k}">`+F.opts.map(o=>`<option value="${o}" ${String(P[F.k])===String(o)?'selected':''}>${F.k==='income'?t('inc'+o):t('o_occ_'+o)}</option>`).join('')+`</select>`;}
    else{const opts=F.type==='yn'?[true,false]:F.opts;
      h+=`<div class="seg">`+opts.map(o=>`<button type="button" data-k="${F.k}" data-v="${o}" class="${String(P[F.k])===String(o)?'on':''}">${F.type==='yn'?t(o?'yes':'no'):t('o_'+F.k+'_'+o)}</button>`).join('')+`</div>`;}
    if(T.en['h_'+F.k])h+=`<div class="hint">${t('h_'+F.k)}</div>`;
    h+=`</div>`;
  }
  $('#form').innerHTML=h;
}
let RES=[];
function summaryText(){
  const lines=RES.filter(r=>r.level==='match').map(r=>'• '+nm(r.s.name)+' — '+nm(r.s.ben));
  return t('shareHead')+'\n'+lines.join('\n');
}
function renderResults(){
  RES=evaluate(P);const tt=totals(RES);
  if(!RES.length){$('#results').innerHTML=`<div class="empty">${t('noRes')}</div>`;return;}
  let h=`<h2>${t('resTitle')}</h2><div class="stats">
   <div class="stat hl"><b>${tt.likely}</b><span>${t('stat_likely')}</span></div>
   <div class="stat"><b>${tt.check}</b><span>${t('stat_check')}</span></div>
   <div class="stat"><b>${inr(tt.cash)}</b><span>${t('stat_cash')}</span></div>
   <div class="stat"><b>${inr(tt.cover)}</b><span>${t('stat_cover')}</span></div></div>`;
  h+=`<div class="tools"><button class="btn pri" data-act="share">${t('share')}</button><button class="btn" data-act="print">${t('print')}</button><button class="btn" data-act="copy">${t('copy')}</button></div>`;
  RES.forEach((r,idx)=>{
    const s=r.s;
    h+=`<article class="card ${r.level}"><div class="top"><h3>${nm(s.name)}</h3><span class="badge">${t(r.level==='match'?'likely':'check')}</span></div>
    <p class="ben">${nm(s.ben)}</p>
    <div class="chips">${r.why.map(w=>`<span class="chip">${t('r_'+w)}</span>`).join('')}</div>
    <details><summary>${t('docsApply')}</summary>
      <ul>${s.docs.map(d=>`<li>${t('d_'+d)}</li>`).join('')}</ul>
      <div>${t('applyAt')}: ${t(s.a)}${s.url?` · <a href="${s.url}" target="_blank" rel="noopener">${t('openSite')} ↗</a>`:''}</div>
    </details>
    <div class="actions"><button class="btn sm" data-say="${idx}">${t('listen')}</button></div></article>`;
  });
  // document bag
  const usage=docUsage(RES);const have=usage.filter(([d])=>bag[d]).length;
  h+=`<div class="panel"><h2>${t('bagTitle')}</h2><div class="hint">${t('bagSub')}</div>
   <div class="bar"><i style="width:${Math.round(100*have/usage.length)}%"></i></div><div class="hint" style="margin:-6px 0 8px">${have}/${usage.length} ${t('ready')}</div>`+
   usage.map(([d,n])=>`<label class="doc"><input type="checkbox" data-doc="${d}" ${bag[d]?'checked':''}><span>${t('d_'+d)}</span><small>${n} ${t('bagUsed')}</small></label>`).join('')+`</div>`;
  // roadmap
  const top=usage.slice(0,3).map(([d])=>t('d_'+d)).join(', ');
  const order=RES.filter(r=>r.level==='match'&&r.s.id!=='jandhan').slice(0,5).map(r=>nm(r.s.name)).join(' → ');
  h+=`<div class="panel"><h2>${t('roadTitle')}</h2><ol class="road"><li>${t(P.bank?'s1_ok':'s1_bank')}</li><li>${t('s2')} <b>${top}</b></li><li>${t('s3')} <b>${order||'—'}</b></li></ol></div>`;
  $('#results').innerHTML=h;
}
function renderAll(){renderStatic();renderForm();renderResults();save();}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.lang){lang=b.dataset.lang;renderAll();return;}
  if(b.dataset.persona!==undefined){P={...PERSONAS[+b.dataset.persona].v};renderAll();return;}
  if(b.dataset.k){const k=b.dataset.k,f=FIELDS.find(x=>x.k===k);P[k]=f.type==='yn'?b.dataset.v==='true':b.dataset.v;
    b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderResults();save();return;}
  if(b.dataset.say!==undefined){const r=RES[+b.dataset.say];speak(nm(r.s.name)+'. '+nm(r.s.ben));return;}
  const a=b.dataset.act;
  if(a==='print')window.print();
  if(a==='share')window.open('https://wa.me/?text='+encodeURIComponent(summaryText()),'_blank','noopener');
  if(a==='copy'){(navigator.clipboard?navigator.clipboard.writeText(summaryText()):Promise.reject()).then(()=>{b.textContent=t('copied')}).catch(()=>{});}
});

});
